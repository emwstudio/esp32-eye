; Cat drinking-water monitor - camera node
; Board: Waveshare ESP32-S3-CAM-OV5640 (ESP32-S3R8: 8MB Octal PSRAM, 16MB QIO Flash)

[env:esp32-s3-cam-ov5640]
; pioarduino 54.03.20 = Arduino core 3.3.x (ESP-IDF 5.5). The official
; platformio/espressif32 still ships core 2.0.17 (no driver/i2s_std.h), so this
; project pins the pioarduino fork, which is the standard way to get core 3.x.
; esp32-camera is bundled with the Arduino core, no extra lib_dep needed.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: Quad-SPI flash + Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_LWIP_TCP_SND_BUF_DEFAULT=65535
  -DCONFIG_LWIP_TCP_WND_DEFAULT=65535

monitor_speed = 115200
upload_speed = 921600

lib_deps =
  links2004/WebSockets@2.6.1
