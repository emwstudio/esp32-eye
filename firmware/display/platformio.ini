; ESP32-S3-Touch-AMOLED-2.16 (Waveshare) - 猫喝水监控桌面屏
; BSP 来源: waveshareteam/ESP32-S3-Touch-AMOLED-2.16 官方 Arduino 示例

[env:amoled216]
; Arduino core 3.3.12（Arduino_GFX 1.6.4 需 Arduino 3.x 的 periman 头）
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.f_flash = 80000000L
; 实测该板 Flash 芯片为 8MB（bootloader 报告 0x800000），勿按 wiki 的 16MB 配置
board_build.flash_size = 8MB
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    lvgl/lvgl@8.4.0
    moononournation/GFX Library for Arduino@1.6.9
    lewisxhe/SensorLib@0.3.3
    bitbank2/JPEGDEC@1.8.4
    bblanchon/ArduinoJson@7.1.0
    gilmaimon/ArduinoWebsockets@0.5.4
    lewisxhe/XPowersLib@0.2.6
